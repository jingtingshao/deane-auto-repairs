services:
  - type: web
    name: deane-auto-repairs
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: deane-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: UPLOADS_DIR
        value: /data/uploads
      - key: PUBLIC_BASE_URL
        value: https://www.deaneauto.co.nz
      - key: MAIL_FROM
        value: Deane Auto Repairs <deaneautonz@gmail.com>
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: deaneautonz@gmail.com
      - key: ADMIN_PIN
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        value: 1WPsTY1EGx5HadxUmY3V4Om60yZ4HpeL1
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REFRESH_TOKEN
        sync: false
      - key: BACKUP_HOUR_NZ
        value: "2"
      - key: BACKUP_KEEP_COUNT
        value: "14"
